<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Flower's Nenascan 🌸 - Detalhes da Obra</title>
    <!-- Fonte estilizada para o título de capítulos -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        #netlify-badge, div[id*="netlify-badge"] { display: none !important; }
        :root {
            --bg-color: #0b0b0e;
            --card-bg: #14141a;
            --primary-pink: #FF99DD; 
            --neon-glow: 0 0 12px rgba(255, 153, 221, 0.7), 0 0 25px rgba(255, 153, 221, 0.35);
            --text-main: #FF99DD;
            --text-muted: #e69ac5;
            --shadow: 0 4px 22px rgba(0, 0, 0, 0.7);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 50px; }
        p, span, a, h1, h2, h3, h4, div, button { color: var(--primary-pink); text-shadow: var(--neon-glow); }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background-color: rgba(11, 11, 14, 0.96); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255, 153, 221, 0.3); }
        .logo-img-container { display: flex; align-items: center; cursor: pointer; text-decoration: none; }
        .icon-btn { background: #181822; border: 1px solid rgba(255, 153, 221, 0.5); color: var(--primary-pink); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-size: 1.3rem; text-shadow: var(--neon-glow); text-decoration: none; }
        .icon-btn svg { width: 22px; height: 22px; fill: currentColor; filter: drop-shadow(0 0 6px rgba(255, 153, 221, 0.7)); }
        .icon-btn:hover { background: var(--primary-pink); color: #0b0b0e; box-shadow: 0 0 15px var(--primary-pink); }

        .obra-container { max-width: 650px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; }

        /* BANNER DE FUNDO */
        .banner-topo {
            position: relative;
            width: 100%;
            height: 310px;
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }
        .banner-topo::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(11,11,14,0.02), rgba(11,11,14,0.35) 80%, #0b0b0e);
        }
        .caminho-breadcrumb {
            position: relative;
            z-index: 2;
            padding: 15px 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-shadow: var(--neon-glow);
            width: 100%;
            max-width: 650px;
        }
        .caminho-breadcrumb a { color: var(--text-muted); text-decoration: none; }
        .caminho-breadcrumb a:hover { color: var(--primary-pink); text-decoration: underline; }

        /* CAPA PRINCIPAL */
        .wrapper-capa-principal {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: -95px;
            position: relative;
            z-index: 5;
            padding: 0 15px;
        }
        .obra-capa-large {
            width: 280px;
            height: 400px;
            object-fit: cover;
            border-radius: 20px;
            border: 2px solid rgba(255, 153, 221, 0.8);
            box-shadow: 0 15px 40px rgba(0,0,0,0.9), var(--neon-glow);
            background: #14141a;
        }

        /* TÍTULO DA OBRA */
        .info-principal-central {
            text-align: center;
            padding: 20px 20px 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }
        .obra-titulo-principal {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 0 10px var(--primary-pink);
            background: linear-gradient(135deg, #ffffff 30%, var(--primary-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* BOTÕES DE AÇÃO */
        .acoes-obra {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 10px 0;
            width: 100%;
            padding: 0 20px;
        }
        .btn-acao {
            background: #181822;
            border: 1px solid var(--primary-pink);
            color: var(--primary-pink);
            padding: 12px 20px;
            border-radius: 24px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            text-shadow: var(--neon-glow);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
            text-decoration: none;
            flex: 1;
            max-width: 190px;
            box-shadow: var(--shadow);
        }
        .btn-acao:hover { background: var(--primary-pink); color: #0b0b0e; box-shadow: 0 0 15px var(--primary-pink); }

        /* BOTÃO FAVORITO COM CORAÇÃO MAIOR E VAZIO */
        .btn-favorito {
            background: #181822;
            border: 1px solid var(--primary-pink);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-favorito:hover {
            background: #181822;
            color: var(--primary-pink);
            box-shadow: 0 0 15px var(--primary-pink);
        }
        .btn-favorito svg {
            width: 22px;
            height: 22px;
            transition: 0.2s;
            fill: none;
            stroke: var(--primary-pink);
            stroke-width: 2.2;
            filter: drop-shadow(0 0 5px rgba(255, 153, 221, 0.5));
        }
        .btn-favorito.favoritado svg {
            fill: var(--primary-pink);
            stroke: var(--primary-pink);
            filter: drop-shadow(0 0 10px var(--primary-pink));
        }

        /* BLOCOS GERAIS */
        .secao-bloco {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin: 15px 15px 0 15px;
            border: 1px solid rgba(255, 153, 221, 0.3);
            box-shadow: var(--shadow);
            width: calc(100% - 30px);
        }
        .sinopse-texto {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-top: 8px;
            text-shadow: none;
        }

        /* INFORMAÇÕES DA OBRA */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }
        .info-item-detalhe {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .info-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: none;
        }
        .info-value {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--primary-pink);
            text-shadow: var(--neon-glow);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        /* BANDEIRINHAS CIRCULARES */
        .bandeira-tipo {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255, 153, 221, 0.6);
            display: inline-block;
            box-shadow: 0 0 5px rgba(255, 153, 221, 0.5);
        }

        .generos-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }
        .tag-genero {
            background: rgba(255, 153, 221, 0.1);
            border: 1px solid rgba(255, 153, 221, 0.35);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.78rem;
            color: var(--primary-pink);
            text-shadow: var(--neon-glow);
            display: inline-block;
        }

        /* ÁREA DE CAPÍTULOS */
        .secao-capitulos-solta {
            width: calc(100% - 30px);
            margin: 25px 15px 0 15px;
        }
        .secao-cabecalho-caps {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 5px;
            border-bottom: 1px solid rgba(255, 153, 221, 0.2);
            padding-bottom: 10px;
        }
        
        .section-title { 
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem; 
            font-weight: 700; 
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 0 10px var(--primary-pink);
            background: linear-gradient(135deg, #ffffff 30%, var(--primary-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cabecalho-dir-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* BOTÃO DE ORDENAÇÃO */
        .btn-ordenar {
            background: #181822;
            border: 1px solid rgba(255, 153, 221, 0.5);
            color: var(--primary-pink);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: var(--shadow);
            padding: 0;
            gap: 1px;
        }
        .btn-ordenar svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
            filter: drop-shadow(0 0 6px rgba(255, 153, 221, 0.9));
        }
        .btn-ordenar:hover {
            background: var(--primary-pink);
            color: #0b0b0e;
            box-shadow: 0 0 15px var(--primary-pink);
        }

        /* TÍTULO DA TEMPORADA */
        .temporada-titulo {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--primary-pink);
            margin: 18px 0 8px 5px;
            text-shadow: var(--neon-glow);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }
        .temporada-titulo .pasta-icone {
            filter: drop-shadow(0 0 8px rgba(255, 153, 221, 0.9)) sepia(100%) hue-rotate(270deg) saturate(300%);
            font-size: 1.1rem;
        }
        
        .lista-capitulos { display: flex; flex-direction: column; gap: 10px; }
        
        .capitulo-item {
            background: rgba(20, 20, 26, 0.6);
            border: 1px solid rgba(255, 153, 221, 0.12);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            transition: 0.2s;
        }
        .capitulo-item:hover {
            border-color: rgba(255, 153, 221, 0.4);
            background: rgba(255, 153, 221, 0.04);
            transform: translateX(4px);
        }
        .cap-esquerda {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .cap-miniatura {
            width: 155px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid rgba(255, 153, 221, 0.35);
            background: #1a1a24;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }
        .cap-info-texto {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .cap-num-principal {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--primary-pink);
            text-shadow: var(--neon-glow);
        }
        .cap-sub-label {
            font-size: 0.82rem;
            color: var(--text-muted);
            text-shadow: none;
            font-weight: 600;
        }
        .cap-direita {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }
        .cap-data {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-shadow: none;
        }
        
        .selo-novo-cap {
            background: rgba(255, 153, 221, 0.2);
            color: var(--primary-pink);
            font-size: 0.62rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 6px;
            letter-spacing: 0.6px;
            border: 1px solid rgba(255, 153, 221, 0.5);
            box-shadow: 0 0 8px rgba(255, 153, 221, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <a href="./" class="logo-img-container">
            <span style="font-size:1.15rem; font-weight:800; color:var(--primary-pink);">flower's nenasscan 🌸</span>
        </a>
        <a href="./" class="icon-btn" title="Voltar ao Início">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </a>
    </header>

    <div class="obra-container" id="detalhes-conteudo">
        <p style="text-align: center; color: var(--text-muted); padding: 50px;">Carregando informações da obra...</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const slugUrl = decodeURIComponent(urlParams.get('nome') || '').trim().toLowerCase();

        let obraGlobal = null;
        let ordemInvertida = false;

        function criarSlug(texto) {
            return String(texto || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-').replace(/[^\w-]/g, '');
        }

        function obterBandeiraTipo(tipo) {
            if (!tipo) return '';
            let t = String(tipo).toLowerCase().trim();
            let sigla = '';
            if (t.includes('manhwa')) sigla = 'kr';
            else if (t.includes('manga')) sigla = 'jp';
            else if (t.includes('manhua')) sigla = 'cn';
            else if (t.includes('comic') || t.includes('webtoon')) sigla = 'us';

            if (!sigla) return '';
            return `<img src="https://flagcdn.com/w40/${sigla}.png" alt="${tipo}" class="bandeira-tipo" title="${tipo}">`;
        }

        function ehCapituloNovo(dataStr) {
            if (!dataStr) return false;
            let partes = dataStr.split('/');
            let dataCap;
            if (partes.length === 3) {
                dataCap = new Date(`${partes[2]}-${partes[1]}-${partes[0]}`);
            } else {
                dataCap = new Date(dataStr);
            }
            if (isNaN(dataCap.getTime())) return false;
            let agora = new Date();
            let diferencaEmMilissegundos = agora - dataCap;
            let diasPassados = diferencaEmMilissegundos / (1000 * 60 * 60 * 24);
            return diasPassados >= 0 && diasPassados <= 5;
        }

        fetch('obras.json?v=' + new Date().getTime())
            .then(res => res.json())
            .then(obras => {
                obraGlobal = obras.find(o => criarSlug(o.titulo) === slugUrl || String(o.id).trim().toLowerCase() === slugUrl || String(o.titulo).trim().toLowerCase() === slugUrl);
                
                if (!obraGlobal) {
                    document.getElementById('detalhes-conteudo').innerHTML = `
                        <div style="text-align:center; padding: 60px 20px;">
                            <h2 style="color:var(--primary-pink);">Obra não encontrada!</h2>
                            <p style="color:var(--text-muted); margin-top: 10px;">O identificador informado na URL não confere com nenhuma obra cadastrada.</p>
                            <a href="./" class="btn-acao" style="display:inline-flex; margin-top:20px; max-width:200px;">Voltar ao Início</a>
                        </div>
                    `;
                    return;
                }

                document.title = `${obraGlobal.titulo} - Flower's Nenascan 🌸`;
                renderizarPagina();
            })
            .catch(err => {
                console.error("Erro ao carregar detalhes:", err);
                document.getElementById('detalhes-conteudo').innerHTML = `<p style="color:red; text-align:center; padding: 40px;">Erro ao carregar os dados da obra.</p>`;
            });

        function renderizarPagina() {
            if (!obraGlobal) return;
            const container = document.getElementById('detalhes-conteudo');
            const slugObraId = obraGlobal.id || criarSlug(obraGlobal.titulo);

            const imagemFundo = obraGlobal.banner || obraGlobal.capa;
            const capaFrente = obraGlobal.capa || obraGlobal.banner;

            let listaCapsHtml = '';
            let totalCaps = obraGlobal.capitulos ? obraGlobal.capitulos.length : 0;

            if (obraGlobal.capitulos && obraGlobal.capitulos.length > 0) {
                let capsParaExibir = [...obraGlobal.capitulos];
                if (ordemInvertida) {
                    capsParaExibir.reverse();
                }

                let temporadaAtual = null;

                capsParaExibir.forEach((cap, index) => {
                    let numCap = typeof cap === 'object' ? cap.numero : cap;
                    let dataCap = typeof cap === 'object' && cap.data ? cap.data : '';
                    let temporadaCap = typeof cap === 'object' && cap.temporada ? cap.temporada : null;

                    if (temporadaCap && temporadaCap !== temporadaAtual) {
                        temporadaAtual = temporadaCap;
                        listaCapsHtml += `<div class="temporada-titulo"><span class="pasta-icone">📁</span> ${temporadaAtual}</div>`;
                    }
                    
                    let capaCap = obraGlobal.capa;
                    if (typeof cap === 'object') {
                        if (cap.capa) {
                            capaCap = cap.capa;
                        } else if (Array.isArray(cap.paginas) && cap.paginas.length > 0) {
                            capaCap = cap.paginas[0];
                        }
                    }

                    let slugCap = String(numCap).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-');
                    let exibirSelo = ehCapituloNovo(dataCap) || (!dataCap && index === 0 && !ordemInvertida);
                    let seloNovoHtml = exibirSelo ? `<span class="selo-novo-cap">NOVO</span>` : '';

                    listaCapsHtml += `
                        <a href="ler.html?obra=${slugObraId}&cap=${slugCap}" class="capitulo-item">
                            <div class="cap-esquerda">
                                <img src="${capaCap}" alt="Cap ${numCap}" class="cap-miniatura">
                                <div class="cap-info-texto">
                                    <span class="cap-num-principal">Cap. ${numCap}</span>
                                    <span class="cap-sub-label">Capítulo ${numCap}</span>
                                </div>
                            </div>
                            <div class="cap-direita">
                                ${seloNovoHtml}
                                <span class="cap-data">${dataCap}</span>
                            </div>
                        </a>
                    `;
                });
            } else {
                listaCapsHtml = `<p style="color: var(--text-muted); text-align: center; padding: 20px;">Nenhum capítulo lançado ainda.</p>`;
            }

            let primeiroCapLink = '#';
            if (obraGlobal.capitulos && obraGlobal.capitulos.length > 0) {
                let primeiro = obraGlobal.capitulos[obraGlobal.capitulos.length - 1]; 
                let numPrimeiro = typeof primeiro === 'object' ? primeiro.numero : primeiro;
                let slugPrimeiro = String(numPrimeiro).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-');
                primeiroCapLink = `ler.html?obra=${slugObraId}&cap=${slugPrimeiro}`;
            }

            let generosHtml = '<span class="info-value">Não informado</span>';
            if (obraGlobal.generos) {
                if (Array.isArray(obraGlobal.generos)) {
                    generosHtml = `<div class="generos-tags">${obraGlobal.generos.map(g => `<span class="tag-genero">${g}</span>`).join('')}</div>`;
                } else {
                    generosHtml = `<div class="generos-tags"><span class="tag-genero">${obraGlobal.generos}</span></div>`;
                }
            }

            let tipoObra = obraGlobal.tipo || 'Manhwa';
            let bandeiraHtml = obterBandeiraTipo(tipoObra);

            container.innerHTML = `
                <!-- BANNER DE FUNDO -->
                <div class="banner-topo" style="background-image: url('${imagemFundo}');">
                    <div class="caminho-breadcrumb">
                        <a href="./">Início</a> / <a href="./?aba=obras">Obras</a> / <span>${obraGlobal.titulo}</span>
                    </div>
                </div>

                <!-- CAPA PRINCIPAL -->
                <div class="wrapper-capa-principal">
                    <img src="${capaFrente}" alt="${obraGlobal.titulo}" class="obra-capa-large">
                </div>

                <!-- TÍTULO DA OBRA -->
                <div class="info-principal-central">
                    <h1 class="obra-titulo-principal">${obraGlobal.titulo}</h1>
                </div>

                <!-- BOTÕES DE AÇÃO -->
                <div class="acoes-obra">
                    <a href="${primeiroCapLink}" class="btn-acao">Ler do Começo</a>
                    <button class="btn-acao btn-favorito" id="btn-favorito" onclick="toggleFavorito('${obraGlobal.titulo}')">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <span id="texto-favorito">Favoritar</span>
                    </button>
                </div>

                <!-- INFORMAÇÕES DA OBRA -->
                <div class="secao-bloco">
                    <h3 style="font-size: 1rem; color: var(--primary-pink); font-weight: 700; margin-bottom: 12px;">Informações</h3>
                    <div class="info-grid">
                        <div class="info-item-detalhe">
                            <span class="info-label">Tipo</span>
                            <span class="info-value">${bandeiraHtml} ${tipoObra}</span>
                        </div>
                        <div class="info-item-detalhe">
                            <span class="info-label">Status</span>
                            <span class="info-value">${obraGlobal.status || 'Em andamento'}</span>
                        </div>
                        <div class="info-item-detalhe" style="grid-column: span 2;">
                            <span class="info-label">Gêneros</span>
                            ${generosHtml}
                        </div>
                        <div class="info-item-detalhe">
                            <span class="info-label">Autor</span>
                            <span class="info-value">${obraGlobal.autor || 'Desconhecido'}</span>
                        </div>
                        <div class="info-item-detalhe">
                            <span class="info-label">Artista</span>
                            <span class="info-value">${obraGlobal.artista || 'Desconhecido'}</span>
                        </div>
                        <div class="info-item-detalhe">
                            <span class="info-label">Classificação</span>
                            <span class="info-value">${obraGlobal.classificacao || 'Livre'}</span>
                        </div>
                        <div class="info-item-detalhe">
                            <span class="info-label">Ano</span>
                            <span class="info-value">${obraGlobal.ano || '2026'}</span>
                        </div>
                    </div>
                </div>

                <!-- SINOPSE -->
                <div class="secao-bloco">
                    <h3 style="font-size: 1rem; color: var(--primary-pink); font-weight: 700;">Sinopse</h3>
                    <p class="sinopse-texto">${obraGlobal.sinopse || 'Nenhuma sinopse cadastrada.'}</p>
                </div>

                <!-- CAPÍTULOS -->
                <div class="secao-capitulos-solta">
                    <div class="secao-cabecalho-caps">
                        <h3 class="section-title">Capítulos</h3>
                        <div class="cabecalho-dir-container">
                            <button class="btn-ordenar" onclick="inverterOrdem()" title="Inverter Ordem">
                                <svg viewBox="0 0 24 24"><path d="M7 14l5-5 5 5z"/></svg>
                                <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                            </button>
                            <span style="font-size: 0.82rem; color: var(--text-muted);">${totalCaps} capítulos</span>
                        </div>
                    </div>
                    <div class="lista-capitulos">
                        ${listaCapsHtml}
                    </div>
                </div>
            `;

            atualizarEstadoFavorito(obraGlobal.titulo);
        }

        function inverterOrdem() {
            ordemInvertida = !ordemInvertida;
            renderizarPagina();
        }

        function toggleFavorito(obraTitulo) {
            let favoritos = [];
            try { favoritos = JSON.parse(localStorage.getItem('flowers_favoritos')) || []; } catch(e) { favoritos = []; }

            const index = favoritos.indexOf(obraTitulo);
            if (index > -1) {
                favoritos.splice(index, 1);
            } else {
                favoritos.push(obraTitulo);
            }

            localStorage.setItem('flowers_favoritos', JSON.stringify(favoritos));
            atualizarEstadoFavorito(obraTitulo);
        }

        function atualizarEstadoFavorito(obraTitulo) {
            let favoritos = [];
            try { favoritos = JSON.parse(localStorage.getItem('flowers_favoritos')) || []; } catch(e) { favoritos = []; }

            const btn = document.getElementById('btn-favorito');
            const texto = document.getElementById('texto-favorito');
            if (btn && texto) {
                if (favoritos.includes(obraTitulo)) {
                    btn.classList.add('favoritado');
                    texto.textContent = 'Favoritado';
                } else {
                    btn.classList.remove('favoritado');
                    texto.textContent = 'Favoritar';
                }
            }
        }
    </script>
</body>
</html>
